[project]
name = "naru_agent"
version = "0.1.0"
description = "Lightweight, reusable agent framework with per-user memory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "litellm>=1.74",
    "chromadb>=1.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
mem0 = ["mem0ai>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -ra"
markers = [
    "integration: requires external DB and mem0ai",
    "slow: slow tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
